global:
  scrape_interval: 5s
  evaluation_interval: 30s

scrape_configs:
  - job_name: bmc-exporter
    scrape_interval: 60s
    scrape_timeout: 60s
    metrics_path: /metrics
    static_configs:
      - targets:
          - localhost:5000

  - job_name: metric-exporter
    scrape_interval: 10s
    scrape_timeout: 10s
    metrics_path: /metrics
    static_configs:
      - targets:
          - localhost:41611

    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
